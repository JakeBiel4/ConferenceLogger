<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Enter School Information</title>
        <style>
            .main {
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
            }
            .data {
                display: flex;
                flex-direction: row;
                justify-content: center;
            }
            .label-group {
                display: flex;
                flex-direction: row;
            }
        </style>
    </head>
    <body>
        <div class="main">
            <div class="label-group">
                <label for="year">Year: </label>
                <select id="year" name="year"></select>
            </div>
            <div class="label-group">
                <label for="state">State: </label>
                <select id="state" name="state"></select>
            </div>
            <div class="data">
                <div class="label-group">
                    <label for="school">School: </label>
                    <input type="text" name="school" id="school">
                </div>
                <div class="label-group">
                    <label for="conf">Conference: </label>
                    <input type="text" name="conf" id="conf">
                </div>
            </div>
            <div class="data">
                <button id="start">Start</button>
                <button id="enter">Enter</button>
                <button id="fill">Fill</button>
            </div>
        </div>
        <script>
            const year = document.getElementById('year');
            const state = document.getElementById('state');
            const school = document.getElementById('school');
            const conf = document.getElementById('conf');
            const start = document.getElementById('start');
            const enter = document.getElementById('enter');
            const fill = document.getElementById('fill');
            year.addEventListener('keydown', (event) => {
                if(event.key === 'ArrowRight'){
                    event.preventDefault();
                    state.focus();
                }else if(event.key === 'ArrowLeft'){
                    event.preventDefault();
                }
            });
            state.addEventListener('keydown', (event) => {
                if(event.key === 'ArrowRight'){
                    event.preventDefault();
                    school.focus();
                }else if(event.key === 'ArrowLeft'){
                    event.preventDefault();
                    year.focus();
                }
            });
            school.addEventListener('keydown', (event) => {
                if(event.key === 'ArrowRight'){
                    event.preventDefault();
                    conf.focus();
                }else if(event.key === 'ArrowLeft'){
                    event.preventDefault();
                    state.focus();
                }
            });
            conf.addEventListener('keydown', (event) => {
                if(event.key === 'ArrowRight'){
                    event.preventDefault();
                    start.focus();
                }else if(event.key === 'ArrowLeft'){
                    event.preventDefault();
                    school.focus();
                }
            });
            start.addEventListener('click', async () => {
                for(let i = 1869; i <= 2026; i++){
                    let opt = document.createElement('option');
                    opt.innerText = i;
                    opt.value = i;
                    year.appendChild(opt);
                }
                const response = await fetch('/states');
                const data = await response.json();
                for(let s of data.states){
                    let st = document.createElement('option');
                    st.innerText = s.name;
                    st.value = s.code;
                    state.appendChild(st);
                }
            });
            start.addEventListener('keydown', (event) => {
                if(event.key === 'ArrowRight'){
                    event.preventDefault();
                    enter.focus();
                }else if(event.key === 'ArrowLeft'){
                    event.preventDefault();
                    conf.focus();
                }
            });
            enter.addEventListener('click', async () => {
                await fetch('/add', {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        year: year.value,
                        Name: school.value,
                        conf: conf.value,
                        state: state.value
                    })
                });
                school.value = "";
                conf.value = "";
            });
            enter.addEventListener('keydown', (event) => {
                if(event.key === 'ArrowRight'){
                    event.preventDefault();
                    fill.focus();
                }else if(event.key === 'ArrowLeft'){
                    event.preventDefault();
                    start.focus();
                }
            });
            fill.addEventListener('click', async () => {
                await fetch('/fill', {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        year: year.value
                    })
                });
            });
            fill.addEventListener('keydown', (event) => {
                if(event.key === 'ArrowRight'){
                    event.preventDefault();
                }else if(event.key === 'ArrowLeft'){
                    event.preventDefault();
                    enter.focus();
                }
            });
            year.focus();
        </script>
    </body>
</html>
