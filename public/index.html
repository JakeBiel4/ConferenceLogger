<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <style>
            .drop {
                background-color: lightgray;
                border: black;
                width: 300px;
                height: 200px;
            }
            .main {
                display: flex;
                flex-direction: column;
                justify-content: center;
            }
            .data {
                display: flex;
                flex-direction: row;
                justify-content: center;
            }
            .label-group {
                display: flex;
                flex-direction: row;
            }
        </style>
    </head>
    <body>
        <div class="main">
            <div class="drop">
                <span>Drag & Drop .json File Here</span>
                <input type="file" name="file-in" id="file-in" accept=".json">
                <button id="submit">Submit</button>
            </div>
            <div id="submit-box" class="main">
                <div class="data">
                    <div class="label-group">
                        <label for="year">Year: </label>
                        <input type="text" name="year" id="year">
                    </div>
                    <div class="label-group">
                        <label for="school">School: </label>
                        <input type="text" name="school" id="school">
                    </div>
                    <div class="label-group">
                        <label for="conf">Conference: </label>
                        <input type="text" name="conf" id="conf">
                    </div>
                </div>
                <div class="data">
                    <button id="enter">Enter</button>
                    <button id="fill">Fill</button>
                    <button id="save">Save</button>
                </div>
            </div>
        </div>
        <script>
            const dropZone = document.getElementById('file-in');
            const submit = document.getElementById('submit');
            const year = document.getElementById('year');
            const school = document.getElementById('school');
            const conf = document.getElementById('conf');
            const enter = document.getElementById('enter');
            const fill = document.getElementById('fill');
            const save = document.getElementById('save');
            submit.addEventListener('click', async () => {
                if(dropZone.files.length === 1){
                    const file = await fetch(dropZone.files[0]);
                    const data = await file.text();
                    console.log(data);
                    /*
                    await fetch('/set', {
                        method: "POST",
                        body: JSON.stringify({
                            file: JSON.stringify(data)
                        })
                    });
                    */
                }
            });
            enter.addEventListener('click', async () => {
                await fetch('/add', {
                    method: "POST",
                    body: JSON.stringify({
                        year: year.value,
                        Name: school.value,
                        conf: conf.value
                    })
                });
                school.value = "";
                conf.value = "";
            });
            fill.addEventListener('click', async () => {
                await fetch('/fill', {
                    method: "POST",
                    body: JSON.stringify({
                        year: year.value
                    })
                });
            });
            save.addEventListener('click', async () => {
                await fetch('/save');
            });
        </script>
    </body>
</html>
