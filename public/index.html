<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <style>
            .drop {
                background-color: lightgray;
                border: black;
                width: 300px;
                height: 200px;
            }
        </style>
    </head>
    <body>
        <div id="main">
            <div class="drop">
                <span>Drag & Drop .json File Here</span>
                <input type="file" name="file-in" id="file-in" accept=".json">
                <button id="submit">Submit</button>
            </div>
            <div id="submit-box">
                <label for="year">Year: </label>
                <input type="text" name="year" id="year">
                <label for="school">School: </label>
                <input type="text" name="school" id="school">
                <label for="conf">Conference: </label>
                <button id="enter">Enter</button>
                <button id="fill">Fill</button>
            </div>
        </div>
        <script>
            const main = document.getElementById('main');
            const dropZone = document.getElementById('file-in');
            const submit = document.getElementById('submit');
            const year = document.getElementById('year');
            const school = document.getElementById('school');
            const conf = document.getElementById('conf');
            const enter = document.getElementById('enter');
            const fill = document.getElementById('fill');
            submit.addEventListener('click', async () => {
                if(dropZone.files.length === 1){
                    const file = await fetch(dropZone.files[0]);
                    const data = await file.text();
                    console.log(data);
                    /*
                    await fetch('/set', {
                        method: "POST",
                        body: JSON.stringify({
                            file: JSON.stringify(data)
                        })
                    });
                    */
                }
            });
            enter.addEventListener('click', async () => {
                await fetch('/add', {
                    method: "POST",
                    body: JSON.stringify({
                        year: year.value,
                        Name: school.value,
                        conf: conf.value
                    })
                });
                school.value = "";
                conf.value = "";
            });
            fill.addEventListener('click', async () => {
                await fetch('/fill', {
                    method: "POST",
                    body: JSON.stringify({
                        year: year.value
                    })
                });
            });
        </script>
    </body>
</html>
